# Runs the checks that gate the webhook deploy, so a push shows ❌ here before the deploy fails.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Whole repo; covers the apps/web rules that `next build` enforces during the deploy.
      # Type-aware rules load every package's program into one process: past Node's default ~2 GB
      # heap on this repo (the run died out of memory), so it gets 8 GB of the runner's 16.
      - name: ESLint
        run: pnpm lint --quiet
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Typecheck
        run: pnpm typecheck
