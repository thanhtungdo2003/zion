# Development stack. Infrastructure only:   docker compose up -d db redis
# Everything (server + web in containers):   docker compose --profile app up --build
name: zion

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zion
      POSTGRES_PASSWORD: zion_dev_password
      POSTGRES_DB: zion
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zion -d zion"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://zion:zion_dev_password@db:5432/zion
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_only_jwt_key_replace_in_production_0123456789}
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_WS_URL: ws://localhost:4000/ws
      WORLD_SEED: ${WORLD_SEED:-zion-alpha}
      WORLDGEN_WORKERS: 2
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
